<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Determinación inicial y cambio sexual en peces</title><desc id="desc">La determinación inicial puede integrar genes y ambiente. Algunas especies cambian de sexo durante su vida: protandria es de macho a hembra y protoginia de hembra a macho.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="#6b4c93" font-weight="700" text-anchor="start">DOS PREGUNTAS DIFERENTES EN PECES</text><rect x="48" y="99" width="864" height="114" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="72" y="142" font-size="28" fill="#29233d" font-weight="700" text-anchor="start">Determinación inicial</text><text x="72" y="184" font-size="25" fill="#29233d" font-weight="400" text-anchor="start">Señales genéticas y ambientales, según la especie.</text><text x="72" y="269" font-size="26" fill="#61418f" font-weight="700" text-anchor="start">Cambio sexual en algunas especies durante la vida</text><text x="72" y="338" font-size="25" fill="#29233d" font-weight="700" text-anchor="start">Protandria</text><rect x="320" y="294" width="185" height="70" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="412" y="339" font-size="27" fill="#29233d" font-weight="400" text-anchor="middle">Macho</text><path d="M520 329 L610 329" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="628" y="294" width="215" height="70" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="736" y="339" font-size="27" fill="#29233d" font-weight="400" text-anchor="middle">Hembra</text><text x="72" y="438" font-size="25" fill="#29233d" font-weight="700" text-anchor="start">Protoginia</text><rect x="320" y="394" width="185" height="70" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="412" y="439" font-size="27" fill="#29233d" font-weight="400" text-anchor="middle">Hembra</text><path d="M520 429 L610 429" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="628" y="394" width="215" height="70" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="736" y="439" font-size="27" fill="#29233d" font-weight="400" text-anchor="middle">Macho</text><text x="480" y="523" font-size="23" fill="#60586b" font-weight="400" text-anchor="middle">Estas estrategias no corresponden a todos los peces.</text></g></svg>