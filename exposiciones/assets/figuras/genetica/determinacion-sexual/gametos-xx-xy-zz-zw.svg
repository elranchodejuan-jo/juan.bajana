<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Gametos en mamíferos domésticos y aves</title><desc id="desc">En el modelo XX/XY la hembra produce gametos X y el macho X o Y. En el modelo ZZ/ZW el macho produce gametos Z y la hembra Z o W. Heterogametia masculina en el primero y femenina en el segundo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="#6b4c93" font-weight="700" text-anchor="start">¿QUIÉN PRODUCE DOS TIPOS DE GAMETOS?</text><rect x="48" y="98" width="864" height="165" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="72" y="133" font-size="26" fill="#29233d" font-weight="700" text-anchor="start">Mamíferos domésticos</text><text x="72" y="184" font-size="25" fill="#29233d" font-weight="400" text-anchor="start">Hembra XX</text><text x="72" y="228" font-size="25" fill="#29233d" font-weight="400" text-anchor="start">Gametos: X</text><text x="500" y="184" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Macho XY</text><text x="500" y="228" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Gametos: X o Y</text><rect x="48" y="298" width="864" height="165" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="72" y="333" font-size="26" fill="#29233d" font-weight="700" text-anchor="start">Aves</text><text x="72" y="384" font-size="25" fill="#29233d" font-weight="400" text-anchor="start">Macho ZZ</text><text x="72" y="428" font-size="25" fill="#29233d" font-weight="400" text-anchor="start">Gametos: Z</text><text x="500" y="384" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Hembra ZW</text><text x="500" y="428" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Gametos: Z o W</text><text x="480" y="514" font-size="22" fill="#60586b" font-weight="400" text-anchor="middle">Heterogametia: dos complementos sexuales posibles en los gametos.</text></g></svg>