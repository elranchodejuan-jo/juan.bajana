<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Gametos en mamíferos domésticos y aves</title><desc id="desc">En el modelo XX/XY la hembra produce gametos X y el macho X o Y. En el modelo ZZ/ZW el macho produce gametos Z y la hembra Z o W. Heterogametia masculina en el primero y femenina en el segundo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">¿QUIÉN PRODUCE DOS TIPOS DE GAMETOS?</text><rect x="48" y="98" width="864" height="165" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="72" y="133" font-size="26" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Mamíferos domésticos</text><text x="72" y="184" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Hembra XX</text><text x="72" y="228" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Gametos:</text><text x="500" y="184" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Macho XY</text><text x="500" y="228" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Gametos:</text><rect x="48" y="298" width="864" height="165" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="72" y="333" font-size="26" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Aves</text><text x="72" y="384" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Macho ZZ</text><text x="72" y="428" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Gametos:</text><text x="500" y="384" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Hembra ZW</text><text x="500" y="428" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Gametos:</text><text x="480" y="514" font-size="22" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">Heterogametia: dos complementos sexuales posibles en los gametos.</text><g aria-hidden="true"><circle cx="273" cy="219" r="22" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="2.5"/><text x="273" y="228" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">X</text></g><g aria-hidden="true"><circle cx="705" cy="219" r="22" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="2.5"/><text x="705" y="228" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">X</text></g><g aria-hidden="true"><circle cx="773" cy="219" r="22" fill="none" stroke="#3ca69e" stroke-width="2.5"/><text x="773" y="228" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">Y</text></g><g aria-hidden="true"><circle cx="273" cy="419" r="22" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="2.5"/><text x="273" y="428" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">Z</text></g><g aria-hidden="true"><circle cx="705" cy="419" r="22" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="2.5"/><text x="705" y="428" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">Z</text></g><g aria-hidden="true"><circle cx="773" cy="419" r="22" fill="none" stroke="#3ca69e" stroke-width="2.5"/><text x="773" y="428" font-size="25" font-weight="700" text-anchor="middle" fill="var(--expo-text, #edf3fb)">W</text></g></g></svg>
