<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Tres niveles del desarrollo sexual</title><desc id="desc">Constitución cromosómica, identidad gonadal y fenotipo son niveles relacionados, pero no siempre coinciden. El aspecto externo no establece por sí solo el cariotipo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">NIVELES RELACIONADOS</text><rect x="70" y="96" width="820" height="100" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><circle cx="122" cy="146" r="26" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="122" y="155" font-size="26" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">1</text><text x="174" y="135" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Constitución cromosómica</text><text x="174" y="171" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Complemento de cromosomas sexuales</text><path d="M480 200 L480 228" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="232" width="820" height="100" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><circle cx="122" cy="282" r="26" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="122" y="291" font-size="26" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">2</text><text x="174" y="271" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Identidad gonadal</text><text x="174" y="307" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Organización y tejido de la gónada</text><path d="M480 336 L480 364" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="368" width="820" height="100" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><circle cx="122" cy="418" r="26" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="122" y="427" font-size="26" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">3</text><text x="174" y="407" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Fenotipo sexual</text><text x="174" y="443" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Conductos, genitales y caracteres somáticos</text><text x="480" y="520" font-size="22" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">La relación puede divergir: un nivel no demuestra por sí solo los demás.</text><g transform="translate(838 146)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-12-17 12 17M12-17-12 17" stroke-width="6"/><path d="M-12-17-15-23M12-17 15-23M-12 17-15 23M12 17 15 23"/></g><g transform="translate(838 282)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="-9" cy="-8" r="10"/><circle cx="11" cy="-3" r="10"/><circle cx="0" cy="13" r="10"/><circle cx="-9" cy="-8" r="2"/><circle cx="11" cy="-3" r="2"/><circle cx="0" cy="13" r="2"/></g><g transform="translate(838 418)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-23 0Q0-25 23 0Q0 25-23 0Z"/><circle r="7"/></g></g></svg>
