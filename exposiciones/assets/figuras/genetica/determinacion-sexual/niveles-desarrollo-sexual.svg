<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Tres niveles del desarrollo sexual</title><desc id="desc">Constitución cromosómica, identidad gonadal y fenotipo son niveles relacionados, pero no siempre coinciden. El aspecto externo no establece por sí solo el cariotipo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="#6b4c93" font-weight="700" text-anchor="start">NIVELES RELACIONADOS</text><rect x="70" y="96" width="820" height="100" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><circle cx="122" cy="146" r="26" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="122" y="155" font-size="26" fill="#61418f" font-weight="700" text-anchor="middle">1</text><text x="174" y="135" font-size="29" fill="#29233d" font-weight="700" text-anchor="start">Constitución cromosómica</text><text x="174" y="171" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">Complemento de cromosomas sexuales</text><path d="M480 200 L480 228" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="232" width="820" height="100" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><circle cx="122" cy="282" r="26" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="122" y="291" font-size="26" fill="#61418f" font-weight="700" text-anchor="middle">2</text><text x="174" y="271" font-size="29" fill="#29233d" font-weight="700" text-anchor="start">Identidad gonadal</text><text x="174" y="307" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">Organización y tejido de la gónada</text><path d="M480 336 L480 364" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="368" width="820" height="100" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><circle cx="122" cy="418" r="26" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="122" y="427" font-size="26" fill="#61418f" font-weight="700" text-anchor="middle">3</text><text x="174" y="407" font-size="29" fill="#29233d" font-weight="700" text-anchor="start">Fenotipo sexual</text><text x="174" y="443" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">Conductos, genitales y caracteres somáticos</text><text x="480" y="520" font-size="22" fill="#60586b" font-weight="400" text-anchor="middle">La relación puede divergir: un nivel no demuestra por sí solo los demás.</text></g></svg>