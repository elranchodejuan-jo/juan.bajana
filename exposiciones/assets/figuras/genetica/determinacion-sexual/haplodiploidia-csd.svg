<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">La abeja melífera puede producir machos diploides</title><desc id="desc">Un huevo no fecundado tiene un juego cromosómico y un alelo de csd: desarrollo masculino. Un huevo fecundado es diploide: heterocigosis de csd favorece hembra y homocigosis permite macho diploide.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="56" font-size="25" fill="#6b4c93" font-weight="700" text-anchor="start">APIS MELLIFERA · PLOIDÍA Y csd</text><rect x="48" y="96" width="864" height="111" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="74" y="136" font-size="25" fill="#29233d" font-weight="700" text-anchor="start">No fecundado</text><text x="74" y="176" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">n · un alelo csd</text><path d="M405 152 L493 152" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="161" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Hemicigosis → macho</text><rect x="48" y="231" width="864" height="111" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="74" y="271" font-size="25" fill="#29233d" font-weight="700" text-anchor="start">Fecundado</text><text x="74" y="311" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">2n · alelos diferentes</text><path d="M405 287 L493 287" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="296" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Heterocigosis → hembra</text><rect x="48" y="366" width="864" height="111" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="74" y="406" font-size="25" fill="#29233d" font-weight="700" text-anchor="start">Fecundado</text><text x="74" y="446" font-size="23" fill="#29233d" font-weight="400" text-anchor="start">2n · alelos iguales</text><path d="M405 422 L493 422" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="431" font-size="25" fill="#61418f" font-weight="700" text-anchor="start">Homocigosis → macho</text><text x="480" y="526" font-size="22" fill="#60586b" font-weight="400" text-anchor="middle">Las letras n y 2n describen juegos cromosómicos completos.</text></g></svg>