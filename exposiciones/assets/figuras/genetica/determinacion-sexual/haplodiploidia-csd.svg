<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">La abeja melífera puede producir machos diploides</title><desc id="desc">Un huevo no fecundado tiene un juego cromosómico y un alelo de csd: desarrollo masculino. Un huevo fecundado es diploide: heterocigosis de csd favorece hembra y homocigosis permite macho diploide.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="56" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">APIS MELLIFERA · PLOIDÍA Y csd</text><rect x="48" y="96" width="864" height="111" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="74" y="136" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">No fecundado</text><text x="74" y="176" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">n · un alelo csd</text><path d="M405 152 L493 152" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="161" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Hemicigosis → macho</text><rect x="48" y="231" width="864" height="111" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="74" y="271" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Fecundado</text><text x="74" y="311" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">2n · alelos diferentes</text><path d="M405 287 L493 287" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="296" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Heterocigosis → hembra</text><rect x="48" y="366" width="864" height="111" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="74" y="406" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Fecundado</text><text x="74" y="446" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">2n · alelos iguales</text><path d="M405 422 L493 422" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="516" y="431" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">Homocigosis → macho</text><text x="480" y="526" font-size="22" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">Las letras n y 2n describen juegos cromosómicos completos.</text><g transform="translate(354 151)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse rx="17" ry="23"/><text x="0" y="7" stroke="none" fill="var(--expo-text, #edf3fb)" text-anchor="middle" font-size="19" font-weight="700">n</text></g><g transform="translate(354 286)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse rx="17" ry="23"/><text x="0" y="7" stroke="none" fill="var(--expo-text, #edf3fb)" text-anchor="middle" font-size="16" font-weight="700">2n</text></g><g transform="translate(354 421)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse rx="17" ry="23"/><text x="0" y="7" stroke="none" fill="var(--expo-text, #edf3fb)" text-anchor="middle" font-size="16" font-weight="700">2n</text></g></g></svg>
