<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Cromosomas, desarrollo y diversidad</title><desc id="desc">Tres perspectivas de la exposición: constitución cromosómica, redes del desarrollo sexual y diversidad de señales genéticas o ambientales.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="60" font-size="22" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">UN TEMA · TRES PERSPECTIVAS</text><rect x="48" y="100" width="256" height="348" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="72" y="142" font-size="22" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">01</text><text x="72" y="362" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Cromosomas</text><text x="72" y="404" font-size="20" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Señales iniciales</text><rect x="352" y="100" width="256" height="348" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="376" y="142" font-size="22" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">02</text><text x="376" y="362" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Desarrollo</text><text x="376" y="404" font-size="20" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Redes y tejidos</text><rect x="656" y="100" width="256" height="348" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="680" y="142" font-size="22" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">03</text><text x="680" y="362" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="start">Diversidad</text><text x="680" y="404" font-size="20" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="start">Múltiples sistemas</text><text x="176" y="230" font-size="31" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">XX / XY</text><text x="176" y="290" font-size="31" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">ZZ / ZW</text><circle cx="430" cy="207" r="20" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><circle cx="527" cy="207" r="20" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><circle cx="480" cy="280" r="20" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><path d="M450 207 L505 207" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M434 226 L469 260" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M520 226 L490 260" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="785" y="226" font-size="29" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">Genes</text><text x="785" y="281" font-size="29" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">Ambiente</text><text x="480" y="509" font-size="22" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">Esquema conceptual · No representa un cariotipo ni una medición</text><g transform="translate(274 140)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="