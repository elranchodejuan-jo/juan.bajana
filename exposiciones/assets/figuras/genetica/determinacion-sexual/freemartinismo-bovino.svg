<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Conexión vascular fetal y freemartinismo bovino</title><desc id="desc">Cuando existe conexión vascular entre fetos bovinos de distinto sexo, se intercambian células y señales. Puede haber quimerismo sanguíneo XX/XY y alteración reproductiva. No todas las cogemelas de macho son freemartin.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="25" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">FREEMARTINISMO BOVINO</text><rect x="48" y="110" width="328" height="143" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="212" y="164" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Cogemela XX</text><text x="212" y="210" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="middle">Circulación fetal</text><rect x="584" y="110" width="328" height="143" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="748" y="164" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Cogemelo XY</text><text x="748" y="210" font-size="23" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="middle">Circulación fetal</text><path d="M387 164 L573 164" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M573 215 L387 215" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="104" font-size="21" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">Si hay conexión</text><rect x="93" y="304" width="774" height="122" rx="18" fill="var(--expo-surface, #111e30)" stroke="#3ca69e" stroke-width="1.6"/><text x="480" y="349" font-size="29" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Intercambio de células y señales</text><text x="480" y="394" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="middle">Puede alterar el desarrollo reproductivo</text><text x="480" y="479" font-size="23" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">Quimerismo sanguíneo XX/XY ≠ todos los tejidos XX/XY</text><text x="480" y="522" font-size="22" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">Ser cogemela de un macho no confirma por sí solo el síndrome.</text><g transform="translate(0 0)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M212 254V278H748V254M480 278V297" marker-end="url(#arrow)"/></g><g transform="translate(360 157)" fill="none" stroke="#3ca69e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-12-15C-12-2-24 3-24 14A12 12 0 0 0 0 14C0 3-12-2-12-15Z"/></g><g transform="translate(896 157)" fill="none" stroke="#3ca69e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-12-15C-12-2-24 3-24 14A12 12 0 0 0 0 14C0 3-12-2-12-15Z"/></g></g></svg>
