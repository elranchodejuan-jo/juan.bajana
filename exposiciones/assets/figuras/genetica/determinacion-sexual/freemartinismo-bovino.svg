<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Conexión vascular fetal y freemartinismo bovino</title><desc id="desc">Cuando existe conexión vascular entre fetos bovinos de distinto sexo, se intercambian células y señales. Puede haber quimerismo sanguíneo XX/XY y alteración reproductiva. No todas las cogemelas de macho son freemartin.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="25" fill="#6b4c93" font-weight="700" text-anchor="start">FREEMARTINISMO BOVINO</text><rect x="48" y="110" width="328" height="143" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="212" y="164" font-size="29" fill="#29233d" font-weight="700" text-anchor="middle">Cogemela XX</text><text x="212" y="210" font-size="23" fill="#29233d" font-weight="400" text-anchor="middle">Circulación fetal</text><rect x="584" y="110" width="328" height="143" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="748" y="164" font-size="29" fill="#29233d" font-weight="700" text-anchor="middle">Cogemelo XY</text><text x="748" y="210" font-size="23" fill="#29233d" font-weight="400" text-anchor="middle">Circulación fetal</text><path d="M387 164 L573 164" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M573 215 L387 215" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="104" font-size="21" fill="#61418f" font-weight="700" text-anchor="middle">Si hay conexión</text><rect x="93" y="304" width="774" height="122" rx="18" fill="#e4f1f0" stroke="#397c79" stroke-width="2"/><text x="480" y="349" font-size="29" fill="#29233d" font-weight="700" text-anchor="middle">Intercambio de células y señales</text><text x="480" y="394" font-size="25" fill="#29233d" font-weight="400" text-anchor="middle">Puede alterar el desarrollo reproductivo</text><text x="480" y="479" font-size="23" fill="#61418f" font-weight="700" text-anchor="middle">Quimerismo sanguíneo XX/XY ≠ todos los tejidos XX/XY</text><text x="480" y="522" font-size="22" fill="#60586b" font-weight="400" text-anchor="middle">Ser cogemela de un macho no confirma por sí solo el síndrome.</text></g></svg>