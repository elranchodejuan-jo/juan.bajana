<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Organización de la gónada bipotencial</title><desc id="desc">La cresta genital integra células somáticas de soporte y del estroma con células germinales precursoras de los gametos. No es un ovario maduro y las células de Sertoli no derivan de las germinales.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="var(--expo-accent, #b7b0ff)"/></marker></defs><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="start">UNA GÓNADA INICIALMENTE BIPOTENCIAL</text><rect x="260" y="92" width="440" height="82" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="480" y="141" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Gónada bipotencial</text><path d="M264 238 L387 179" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M695 238 L572 179" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="245" width="400" height="134" rx="18" fill="var(--expo-accent-soft, #282442)" fill-opacity=".72" stroke="var(--expo-border, #485577)" stroke-width="1.6"/><text x="228" y="289" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Células somáticas</text><text x="228" y="330" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="middle">Soporte y estroma</text><rect x="510" y="245" width="400" height="134" rx="18" fill="var(--expo-surface, #111e30)" stroke="#3ca69e" stroke-width="1.6"/><text x="686" y="289" font-size="28" fill="var(--expo-text, #edf3fb)" font-weight="700" text-anchor="middle">Células germinales</text><text x="686" y="330" font-size="25" fill="var(--expo-text, #edf3fb)" font-weight="400" text-anchor="middle">Precursoras de gametos</text><text x="480" y="220" font-size="21" fill="var(--expo-muted, #b5c6da)" text-anchor="middle">Se integran</text><text x="480" y="438" font-size="26" fill="var(--expo-accent, #b7b0ff)" font-weight="700" text-anchor="middle">La red reguladora organiza el desarrollo gonadal.</text><text x="480" y="496" font-size="23" fill="var(--expo-muted, #b5c6da)" font-weight="400" text-anchor="middle">Bipotencial ≠ ovario maduro · Sin cronología universal</text><g transform="translate(408 303)" fill="none" stroke="var(--expo-accent, #b7b0ff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="-9" cy="-8" r="10"/><circle cx="11" cy="-3" r="10"/><circle cx="0" cy="13" r="10"/><circle cx="-9" cy="-8" r="2"/><circle cx="11" cy="-3" r="2"/><circle cx="0" cy="13" r="2"/></g><g transform="translate(866 303)" fill="none" stroke="#3ca69e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle r="22"/><circle r="8"/></g></g></svg>
