<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Organización de la gónada bipotencial</title><desc id="desc">La cresta genital integra células somáticas de soporte y del estroma con células germinales precursoras de los gametos. No es un ovario maduro y las células de Sertoli no derivan de las germinales.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#6e547e"/></marker></defs><rect width="960" height="560" rx="24" fill="#faf8fd"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="24" fill="#6b4c93" font-weight="700" text-anchor="start">UNA GÓNADA INICIALMENTE BIPOTENCIAL</text><rect x="260" y="92" width="440" height="82" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="480" y="141" font-size="28" fill="#29233d" font-weight="700" text-anchor="middle">Gónada bipotencial</text><path d="M264 238 L387 179" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M695 238 L572 179" stroke="#6e547e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="245" width="400" height="134" rx="18" fill="#eee8fa" stroke="#7c58aa" stroke-width="2"/><text x="250" y="289" font-size="28" fill="#29233d" font-weight="700" text-anchor="middle">Células somáticas</text><text x="250" y="330" font-size="25" fill="#29233d" font-weight="400" text-anchor="middle">Soporte y estroma</text><rect x="510" y="245" width="400" height="134" rx="18" fill="#e4f1f0" stroke="#397c79" stroke-width="2"/><text x="710" y="289" font-size="28" fill="#29233d" font-weight="700" text-anchor="middle">Células germinales</text><text x="710" y="330" font-size="25" fill="#29233d" font-weight="400" text-anchor="middle">Precursoras de gametos</text><text x="480" y="220" font-size="21" fill="#60586b" text-anchor="middle">Se integran</text><text x="480" y="438" font-size="26" fill="#61418f" font-weight="700" text-anchor="middle">La red reguladora organiza el desarrollo gonadal.</text><text x="480" y="496" font-size="23" fill="#60586b" font-weight="400" text-anchor="middle">Bipotencial ≠ ovario maduro · Sin cronología universal</text></g></svg>