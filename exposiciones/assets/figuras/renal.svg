<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" class="diagram" role="img" aria-labelledby="renal-title renal-desc">
<title id="renal-title">Regulación renal del bicarbonato y del ácido</title>
<desc id="renal-desc">Se distinguen dos funciones. Primera: los túbulos recuperan bicarbonato filtrado y lo devuelven a la sangre, conservando una base existente. Segunda: la excreción neta de ácido urinario como amonio y ácido titulable se asocia a la incorporación de bicarbonato nuevo a la sangre. Esquema funcional, no anatómico.</desc>
<style>text {font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-kerning:normal}
.heading {font-size:31px;font-weight:700}
.subheading {font-size:22px;font-weight:400}
.label {font-size:25px;font-weight:600}
.small {font-size:22px;font-weight:400}
.chemical {font-size:34px;font-weight:600}
.flow {stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.rule {stroke-width:1.5}
.node {stroke-width:1.5}
.diagram .canvas {fill:#F8FCFF;stroke:#A9CFDF}
.diagram .ink {fill:#123345}
.diagram .muted {fill:#315A70}
.diagram .accent {fill:#086D95}
.diagram .node {fill:#E4F4FC;stroke:#A9CFDF}
.diagram .flow {fill:none;stroke:#086D95}
.diagram .rule {stroke:#A9CFDF}
.diagram .arrowhead {fill:#086D95}
@media (prefers-color-scheme:dark) {
.diagram .canvas {fill:#0B1729;stroke:#35576C}
.diagram .ink {fill:#F1F8FF}
.diagram .muted {fill:#B9D9EA}
.diagram .accent {fill:#65D6EF}
.diagram .node {fill:#12304A;stroke:#35576C}
.diagram .flow {fill:none;stroke:#65D6EF}
.diagram .rule {stroke:#35576C}
.diagram .arrowhead {fill:#65D6EF}
}
.diagram[data-theme="light"] .canvas {fill:#F8FCFF;stroke:#A9CFDF}
.diagram[data-theme="light"] .ink {fill:#123345}
.diagram[data-theme="light"] .muted {fill:#315A70}
.diagram[data-theme="light"] .accent {fill:#086D95}
.diagram[data-theme="light"] .node {fill:#E4F4FC;stroke:#A9CFDF}
.diagram[data-theme="light"] .flow {fill:none;stroke:#086D95}
.diagram[data-theme="light"] .rule {stroke:#A9CFDF}
.diagram[data-theme="light"] .arrowhead {fill:#086D95}
.diagram[data-theme="dark"] .canvas {fill:#0B1729;stroke:#35576C}
.diagram[data-theme="dark"] .ink {fill:#F1F8FF}
.diagram[data-theme="dark"] .muted {fill:#B9D9EA}
.diagram[data-theme="dark"] .accent {fill:#65D6EF}
.diagram[data-theme="dark"] .node {fill:#12304A;stroke:#35576C}
.diagram[data-theme="dark"] .flow {fill:none;stroke:#65D6EF}
.diagram[data-theme="dark"] .rule {stroke:#35576C}
.diagram[data-theme="dark"] .arrowhead {fill:#65D6EF}</style>
<defs><marker id="renal-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" x="1" y="1" width="718" height="478" rx="16" stroke-width="1.5"/>
<text x="32" y="50" class="heading ink">Regulación renal</text>
<text x="32" y="102" class="label ink">1. Recuperación del bicarbonato filtrado</text>
<text x="125" y="153" class="label ink" text-anchor="middle">Filtrado</text>
<text x="125" y="185" class="label accent" text-anchor="middle">HCO₃⁻</text>
<text x="360" y="153" class="label ink" text-anchor="middle">Túbulos</text>
<text x="360" y="185" class="small muted" text-anchor="middle">Reabsorción</text>
<text x="600" y="153" class="label ink" text-anchor="middle">Sangre</text>
<text x="600" y="185" class="label accent" text-anchor="middle">HCO₃⁻</text>
<path class="flow" d="M 201 159 H 253" marker-end="url(#renal-arrow)"/>
<path class="flow" d="M 466 159 H 520" marker-end="url(#renal-arrow)"/>
<text x="360" y="230" class="small muted" text-anchor="middle">Conserva una base ya existente.</text>
<line class="rule" x1="32" x2="688" y1="256" y2="256"/>
<text x="32" y="301" class="label ink">2. Excreción neta de ácido</text>
<text x="360" y="370" class="label ink" text-anchor="middle">Riñón</text>
<text x="113" y="370" class="label ink" text-anchor="middle">Sangre</text>
<text x="608" y="370" class="label ink" text-anchor="middle">Orina</text>
<path class="flow" d="M 294 363 H 194" marker-end="url(#renal-arrow)"/>
<path class="flow" d="M 426 363 H 523" marker-end="url(#renal-arrow)"/>
<text x="113" y="415" class="small accent" text-anchor="middle">HCO₃⁻ nuevo</text>
<text x="608" y="410" class="small accent" text-anchor="middle">NH₄⁺ y ácido</text>
<text x="608" y="442" class="small accent" text-anchor="middle">titulable</text>
</svg>